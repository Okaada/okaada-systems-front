name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar HTML e política de segurança
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Auditar dependências
        run: npm audit --omit=optional

      - name: Validar
        run: npm run validate
